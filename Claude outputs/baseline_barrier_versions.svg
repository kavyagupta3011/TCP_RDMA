<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1075" width="1000" height="1075" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="1000" height="1075" fill="#fff"/>
<text x="500" y="36" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="700">Baseline_Barrier in every version</text>
<text x="500" y="58" font-size="14" fill="#555" text-anchor="middle" font-weight="400">What computer A does in one round (B and C do the same). Boxes are in time order, left to right. Not to scale.</text>
<rect x="60" y="72" width="16" height="14" rx="3" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="82" y="84" font-size="12" fill="#444" text-anchor="start" font-weight="400">send data</text>
<rect x="161" y="72" width="16" height="14" rx="3" fill="#fde7cd" stroke="#a14b00" stroke-width="1.5"/>
<text x="183" y="84" font-size="12" fill="#444" text-anchor="start" font-weight="400">barrier (wait for everyone)</text>
<rect x="388" y="72" width="16" height="14" rx="3" fill="#e3f3e4" stroke="#256029" stroke-width="1.5"/>
<text x="410" y="84" font-size="12" fill="#444" text-anchor="start" font-weight="400">add the vectors</text>
<rect x="531" y="72" width="16" height="14" rx="3" fill="#ece4f7" stroke="#5b3a9a" stroke-width="1.5"/>
<text x="553" y="84" font-size="12" fill="#444" text-anchor="start" font-weight="400">checks / timing</text>
<rect x="674" y="72" width="16" height="14" rx="3" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
<text x="696" y="84" font-size="12" fill="#444" text-anchor="start" font-weight="400">set-up, once</text>
<rect x="30" y="95" width="940" height="270" rx="10" fill="#f6f8fb" stroke="#c9d3e0" stroke-width="1.5"/>
<text x="50" y="121" font-size="17" fill="#1f4e8c" text-anchor="start" font-weight="700">v1   paper_algorithms</text>
<text x="50" y="141" font-size="13" fill="#555" text-anchor="start" font-weight="400">The first version: works, but slow and with a hidden bug</text>
<rect x="50" y="161" width="160" height="46" rx="6" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="130.0" y="180.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">write to B,</text>
<text x="130.0" y="196.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">wait until delivered</text>
<line x1="212" y1="184" x2="236" y2="184" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="238" y="161" width="160" height="46" rx="6" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="318.0" y="180.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">then write to C,</text>
<text x="318.0" y="196.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">wait until delivered</text>
<line x1="400" y1="184" x2="424" y2="184" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="426" y="161" width="150" height="46" rx="6" fill="#fde7cd" stroke="#a14b00" stroke-width="1.5"/>
<text x="501.0" y="180.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">barrier with B and C</text>
<text x="501.0" y="196.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">(SEND / RECV)</text>
<line x1="578" y1="184" x2="602" y2="184" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="604" y="161" width="170" height="46" rx="6" fill="#e3f3e4" stroke="#256029" stroke-width="1.5"/>
<text x="689.0" y="180.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">add: out[i] = mine[i]</text>
<text x="689.0" y="196.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">+ fromB[i] + fromC[i]</text>
<line x1="776" y1="184" x2="800" y2="184" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="802" y="161" width="150" height="46" rx="6" fill="#ece4f7" stroke="#5b3a9a" stroke-width="1.5"/>
<text x="877.0" y="180.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">print the average</text>
<text x="877.0" y="196.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">time only</text>
<text x="50" y="231" font-size="13" fill="#444" text-anchor="start" font-weight="400">The two writes happen one after the other: two waits in a row.</text>
<text x="50" y="267" font-size="13" fill="#222" text-anchor="start" font-weight="700">Mailbox on A for data coming from B:</text>
<rect x="50" y="277" width="150" height="40" rx="6" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="125.0" y="293.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">ONE slot</text>
<text x="125.0" y="309.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">used every round</text>
<text x="215" y="293" font-size="13" fill="#b3261e" text-anchor="start" font-weight="400">B finishes round 1 early, starts round 2, and writes into the SAME slot</text>
<text x="215" y="311" font-size="13" fill="#b3261e" text-anchor="start" font-weight="400">while A is still adding round 1.  A then adds half old, half new data.</text>
<text x="50" y="343" font-size="13" fill="#444" text-anchor="start" font-weight="400">It was never noticed because every round used the same numbers, so overwriting old data with the same data looked fine.</text>
<text x="50" y="363" font-size="13" fill="#444" text-anchor="start" font-weight="400">Also: only one correctness check (first round), no start/end barrier, so the first timed round includes connection skew.</text>
<rect x="30" y="380" width="940" height="270" rx="10" fill="#f6f8fb" stroke="#c9d3e0" stroke-width="1.5"/>
<text x="50" y="406" font-size="17" fill="#1f4e8c" text-anchor="start" font-weight="700">v2   paper_algorithms_v2</text>
<text x="50" y="426" font-size="13" fill="#555" text-anchor="start" font-weight="400">Same idea, overlapped sends, two mailboxes, better timing</text>
<rect x="50" y="446" width="100" height="46" rx="6" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
<text x="100.0" y="465.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">start barrier</text>
<text x="100.0" y="481.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">(once, all ranks)</text>
<line x1="152" y1="469" x2="176" y2="469" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="178" y="446" width="170" height="21" rx="6" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="263.0" y="460.5" font-size="12" fill="#222" text-anchor="middle" font-weight="400">write to B</text>
<rect x="178" y="471" width="170" height="21" rx="6" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="263.0" y="485.5" font-size="12" fill="#222" text-anchor="middle" font-weight="400">write to C   (same time)</text>
<line x1="350" y1="469" x2="374" y2="469" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="376" y="446" width="110" height="46" rx="6" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="431.0" y="465.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">wait for both</text>
<text x="431.0" y="481.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">writes</text>
<line x1="488" y1="469" x2="512" y2="469" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="514" y="446" width="140" height="46" rx="6" fill="#fde7cd" stroke="#a14b00" stroke-width="1.5"/>
<text x="584.0" y="465.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">barrier with</text>
<text x="584.0" y="481.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">B and C</text>
<line x1="656" y1="469" x2="680" y2="469" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="682" y="446" width="130" height="46" rx="6" fill="#e3f3e4" stroke="#256029" stroke-width="1.5"/>
<text x="747.0" y="465.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">add: element by</text>
<text x="747.0" y="481.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">element (same)</text>
<line x1="814" y1="469" x2="838" y2="469" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="840" y="446" width="112" height="46" rx="6" fill="#ece4f7" stroke="#5b3a9a" stroke-width="1.5"/>
<text x="896.0" y="465.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">min / median</text>
<text x="896.0" y="481.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">p99 / max</text>
<text x="50" y="516" font-size="13" fill="#444" text-anchor="start" font-weight="400">One overlapped wait instead of two in a row. An end barrier (once, after the last round) stops anyone closing early.</text>
<text x="50" y="552" font-size="13" fill="#222" text-anchor="start" font-weight="700">Mailbox on A for data coming from B:</text>
<rect x="50" y="562" width="150" height="40" rx="6" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="125.0" y="578.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">slot 0</text>
<text x="125.0" y="594.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">even rounds</text>
<rect x="206" y="562" width="150" height="40" rx="6" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="281.0" y="578.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">slot 1</text>
<text x="281.0" y="594.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">odd rounds</text>
<text x="372" y="578" font-size="13" fill="#256029" text-anchor="start" font-weight="400">B's round-2 write goes to the OTHER slot, so A's round-1 data is safe.</text>
<text x="372" y="596" font-size="13" fill="#256029" text-anchor="start" font-weight="400">The barrier keeps anyone from getting two rounds ahead, so two slots are enough.</text>
<text x="50" y="628" font-size="13" fill="#444" text-anchor="start" font-weight="400">Still checks the result only once, and the add is the same plain loop as v1.</text>
<rect x="30" y="665" width="940" height="270" rx="10" fill="#f6f8fb" stroke="#c9d3e0" stroke-width="1.5"/>
<text x="50" y="691" font-size="17" fill="#1f4e8c" text-anchor="start" font-weight="700">v3   paper_algorithms_v3</text>
<text x="50" y="711" font-size="13" fill="#555" text-anchor="start" font-weight="400">Same as v2, plus a check on every round and a faster add</text>
<rect x="50" y="731" width="100" height="46" rx="6" fill="#eeeeee" stroke="#777" stroke-width="1.5"/>
<text x="100.0" y="750.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">start barrier</text>
<text x="100.0" y="766.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">(once)</text>
<line x1="152" y1="754" x2="176" y2="754" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="178" y="731" width="110" height="46" rx="6" fill="#ece4f7" stroke="#5b3a9a" stroke-width="1.5"/>
<text x="233.0" y="742.0" font-size="10" fill="#222" text-anchor="middle" font-weight="400">put a stamp in</text>
<text x="233.0" y="758.0" font-size="10" fill="#222" text-anchor="middle" font-weight="400">first/last number</text>
<text x="233.0" y="774.0" font-size="10" fill="#222" text-anchor="middle" font-weight="400">(before the clock)</text>
<line x1="290" y1="754" x2="314" y2="754" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="316" y="731" width="110" height="21" rx="6" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="371.0" y="745.5" font-size="11" fill="#222" text-anchor="middle" font-weight="400">write to B</text>
<rect x="316" y="756" width="110" height="21" rx="6" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="371.0" y="770.5" font-size="11" fill="#222" text-anchor="middle" font-weight="400">write to C</text>
<line x1="428" y1="754" x2="452" y2="754" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="454" y="731" width="90" height="46" rx="6" fill="#dce9f9" stroke="#1f4e8c" stroke-width="1.5"/>
<text x="499.0" y="750.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">wait for</text>
<text x="499.0" y="766.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">writes</text>
<line x1="546" y1="754" x2="570" y2="754" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="572" y="731" width="100" height="46" rx="6" fill="#fde7cd" stroke="#a14b00" stroke-width="1.5"/>
<text x="622.0" y="750.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">barrier with</text>
<text x="622.0" y="766.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">B and C</text>
<line x1="674" y1="754" x2="698" y2="754" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="700" y="731" width="140" height="46" rx="6" fill="#e3f3e4" stroke="#256029" stroke-width="1.5"/>
<text x="770.0" y="742.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">blocked add:</text>
<text x="770.0" y="758.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">4096 numbers at</text>
<text x="770.0" y="774.0" font-size="11" fill="#222" text-anchor="middle" font-weight="400">a time</text>
<line x1="842" y1="754" x2="866" y2="754" stroke="#555" stroke-width="2" marker-end="url(#m)"/>
<rect x="868" y="731" width="84" height="46" rx="6" fill="#ece4f7" stroke="#5b3a9a" stroke-width="1.5"/>
<text x="910.0" y="750.0" font-size="10" fill="#222" text-anchor="middle" font-weight="400">check: PASSED</text>
<text x="910.0" y="766.0" font-size="10" fill="#222" text-anchor="middle" font-weight="400">or FAILED</text>
<text x="50" y="801" font-size="13" fill="#444" text-anchor="start" font-weight="400">The stamps change every round, so reading a stale slot gives a wrong total and the check fails.</text>
<text x="50" y="837" font-size="13" fill="#222" text-anchor="start" font-weight="700">Blocked add (same answer, same order of additions):</text>
<rect x="50" y="847" width="170" height="40" rx="6" fill="#e3f3e4" stroke="#256029" stroke-width="1.5"/>
<text x="135.0" y="871.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">out = my chunk</text>
<text x="226" y="872" font-size="16" fill="#222" text-anchor="middle" font-weight="400">+</text>
<rect x="236" y="847" width="170" height="40" rx="6" fill="#e3f3e4" stroke="#256029" stroke-width="1.5"/>
<text x="321.0" y="871.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">+= B's chunk</text>
<text x="412" y="872" font-size="16" fill="#222" text-anchor="middle" font-weight="400">+</text>
<rect x="422" y="847" width="170" height="40" rx="6" fill="#e3f3e4" stroke="#256029" stroke-width="1.5"/>
<text x="507.0" y="871.0" font-size="12" fill="#222" text-anchor="middle" font-weight="400">+= C's chunk</text>
<text x="608" y="863" font-size="13" fill="#256029" text-anchor="start" font-weight="400">then the next 4096. Short simple loops let the compiler</text>
<text x="608" y="881" font-size="13" fill="#256029" text-anchor="start" font-weight="400">use vector instructions and keep the chunk in cache.</text>
<text x="50" y="913" font-size="13" fill="#444" text-anchor="start" font-weight="400">This check would have caught v1's overwrite bug. v3 also compiles with -O3 (v1 and v2 used -O2).</text>
<rect x="30" y="950" width="940" height="100" rx="10" fill="#eef7ee" stroke="#b9d9bb" stroke-width="1.5"/>
<text x="50" y="976" font-size="17" fill="#1f4e8c" text-anchor="start" font-weight="700">v4, v5, v6   (paper_algorithms_v4 / _v5 / _v6)</text>
<text x="50" y="996" font-size="13" fill="#555" text-anchor="start" font-weight="400">The Baseline_Barrier file and its compiler flags are exactly v3's: zero changed lines</text>
<text x="50" y="1022" font-size="13" fill="#222" text-anchor="start" font-weight="400">Everything you did after v3 went into Twoshot_LL and Twoshot_Sentinel. Baseline_Barrier stayed untouched, so it is your fixed yardstick.</text>
<text x="50" y="1040" font-size="13" fill="#222" text-anchor="start" font-weight="400">Only the shared helper file changed a little (v6: deeper queues), which this program does not need. Differences between v3 and v6 should be noise.</text>
</svg>