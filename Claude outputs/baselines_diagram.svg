<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1010" width="1000" height="1010" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e8c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a14b00"/></marker>
  </defs>
  <rect width="1000" height="1010" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">What the baselines folder does</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#555">It holds the standard ring AllReduce, so your own algorithms have a fair thing to be compared against</text>

  <!-- Panel 1 -->
  <rect x="30" y="80" width="940" height="150" rx="10" fill="#f4f7fb" stroke="#c5d3e6"/>
  <text x="50" y="108" font-size="16" font-weight="700" fill="#1f4e8c">1. What is inside</text>
  <text x="50" y="136" font-size="14" font-family="Consolas, monospace" fill="#222">baselines/</text>
  <text x="70" y="160" font-size="14" font-family="Consolas, monospace" fill="#222">Ring_AllReduce/ring_allreduce_rdma.c</text>
  <text x="440" y="160" font-size="14" fill="#444">the program: the ring algorithm written with RDMA SEND/RECV</text>
  <text x="70" y="184" font-size="14" font-family="Consolas, monospace" fill="#222">run_ring.sh, ring_job.pbs</text>
  <text x="440" y="184" font-size="14" fill="#444">start it on the 3 cluster nodes, same sizes as the other programs</text>
  <text x="70" y="208" font-size="14" font-family="Consolas, monospace" fill="#222">RESULTS_vs_ring.md</text>
  <text x="440" y="208" font-size="14" fill="#444">the ring's times next to your versions</text>

  <!-- Panel 2 -->
  <rect x="30" y="250" width="940" height="360" rx="10" fill="#f4f7fb" stroke="#c5d3e6"/>
  <text x="50" y="278" font-size="16" font-weight="700" fill="#1f4e8c">2. What the ring program does: 3 computers, each holding 3 numbers</text>

  <g>
    <circle cx="140" cy="360" r="34" fill="#dce9f9" stroke="#1f4e8c" stroke-width="2"/><text x="140" y="367" text-anchor="middle" font-size="20" font-weight="700" fill="#1f4e8c">A</text>
    <circle cx="330" cy="360" r="34" fill="#dce9f9" stroke="#1f4e8c" stroke-width="2"/><text x="330" y="367" text-anchor="middle" font-size="20" font-weight="700" fill="#1f4e8c">B</text>
    <circle cx="235" cy="520" r="34" fill="#dce9f9" stroke="#1f4e8c" stroke-width="2"/><text x="235" y="527" text-anchor="middle" font-size="20" font-weight="700" fill="#1f4e8c">C</text>
    <line x1="176" y1="360" x2="292" y2="360" stroke="#1f4e8c" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="318" y1="393" x2="262" y2="490" stroke="#1f4e8c" stroke-width="2.5" marker-end="url(#ar)"/>
    <line x1="208" y1="492" x2="152" y2="395" stroke="#1f4e8c" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="235" y="345" text-anchor="middle" font-size="12" fill="#1f4e8c">send</text>
    <text x="50" y="298" font-size="12" fill="#555">Each computer only sends to its right neighbour</text>
    <text x="50" y="314" font-size="12" fill="#555">(A to B to C to A) and only receives from its left.</text>
    </g>

  <!-- table -->
  <g font-size="13" fill="#222">
    <rect x="420" y="292" width="530" height="26" fill="#1f4e8c"/>
    <text x="432" y="310" fill="#fff" font-weight="700">step</text>
    <text x="520" y="310" fill="#fff" font-weight="700">what is sent</text>
    <text x="660" y="310" fill="#fff" font-weight="700">A</text>
    <text x="760" y="310" fill="#fff" font-weight="700">B</text>
    <text x="860" y="310" fill="#fff" font-weight="700">C</text>

    <rect x="420" y="318" width="530" height="32" fill="#ffffff" stroke="#d5deea"/>
    <text x="432" y="339">start</text><text x="520" y="339" fill="#555">nothing yet</text>
    <text x="660" y="339" font-family="Consolas, monospace">1 2 3</text><text x="760" y="339" font-family="Consolas, monospace">10 20 30</text><text x="860" y="339" font-family="Consolas, monospace">100 200 300</text>

    <rect x="420" y="350" width="530" height="20" fill="#fff4e5"/>
    <text x="432" y="365" font-weight="700" fill="#a14b00">Lap 1: ADD (each receiver adds into its own number)</text>

    <rect x="420" y="370" width="530" height="40" fill="#ffffff" stroke="#d5deea"/>
    <text x="432" y="387">round 1</text><text x="520" y="395" fill="#555">A:1  B:20  C:300</text>
    <text x="660" y="395" font-family="Consolas, monospace">1 2 303</text><text x="760" y="395" font-family="Consolas, monospace">11 20 30</text><text x="860" y="395" font-family="Consolas, monospace">100 220 300</text>

    <rect x="420" y="410" width="530" height="40" fill="#ffffff" stroke="#d5deea"/>
    <text x="432" y="427">round 2</text><text x="520" y="435" fill="#555">A:303  B:11  C:220</text>
    <text x="660" y="435" font-family="Consolas, monospace">1 222 303</text><text x="760" y="435" font-family="Consolas, monospace">11 20 333</text><text x="860" y="435" font-family="Consolas, monospace">111 220 300</text>

    <rect x="420" y="450" width="530" height="20" fill="#e8f5e9"/>
    <text x="432" y="465" font-weight="700" fill="#256029">Now each one holds exactly one finished total (222, 333, 111)</text>

    <rect x="420" y="470" width="530" height="20" fill="#fff4e5"/>
    <text x="432" y="485" font-weight="700" fill="#a14b00">Lap 2: COPY (no adding, just pass the finished totals on)</text>

    <rect x="420" y="490" width="530" height="40" fill="#ffffff" stroke="#d5deea"/>
    <text x="432" y="507">round 3</text><text x="520" y="515" fill="#555">A:222  B:333  C:111</text>
    <text x="660" y="515" font-family="Consolas, monospace">111 222 303</text><text x="760" y="515" font-family="Consolas, monospace">11 222 333</text><text x="860" y="515" font-family="Consolas, monospace">111 220 333</text>

    <rect x="420" y="530" width="530" height="40" fill="#ffffff" stroke="#d5deea"/>
    <text x="432" y="547">round 4</text><text x="520" y="555" fill="#555">the other totals</text>
    <text x="660" y="555" font-family="Consolas, monospace" font-weight="700" fill="#256029">111 222 333</text><text x="760" y="555" font-family="Consolas, monospace" font-weight="700" fill="#256029">111 222 333</text><text x="860" y="555" font-family="Consolas, monospace" font-weight="700" fill="#256029">111 222 333</text>
  </g>
  <text x="50" y="592" font-size="13" fill="#444">In the code: the first for-loop is lap 1 (add), the second for-loop is lap 2 (copy). 3 computers means 2 + 2 = 4 rounds.</text>

  <!-- Panel 3 -->
  <rect x="30" y="630" width="940" height="270" rx="10" fill="#fdf6ee" stroke="#e6cfae"/>
  <text x="50" y="658" font-size="16" font-weight="700" fill="#a14b00">3. How it differs from your other programs (Baseline_Barrier, LL, Sentinel, Two-shot)</text>

  <text x="250" y="690" text-anchor="middle" font-size="14" font-weight="700" fill="#a14b00">Your one-shot programs</text>
  <circle cx="130" cy="760" r="28" fill="#fde7cd" stroke="#a14b00" stroke-width="2"/><text x="130" y="767" text-anchor="middle" font-size="18" font-weight="700" fill="#a14b00">A</text>
  <circle cx="370" cy="760" r="28" fill="#fde7cd" stroke="#a14b00" stroke-width="2"/><text x="370" y="767" text-anchor="middle" font-size="18" font-weight="700" fill="#a14b00">B</text>
  <circle cx="250" cy="850" r="28" fill="#fde7cd" stroke="#a14b00" stroke-width="2"/><text x="250" y="857" text-anchor="middle" font-size="18" font-weight="700" fill="#a14b00">C</text>
  <line x1="160" y1="752" x2="338" y2="752" stroke="#a14b00" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="340" y1="768" x2="162" y2="768" stroke="#a14b00" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="145" y1="785" x2="230" y2="830" stroke="#a14b00" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="270" y1="827" x2="188" y2="781" stroke="#a14b00" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="355" y1="785" x2="270" y2="830" stroke="#a14b00" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="232" y1="830" x2="318" y2="783" stroke="#a14b00" stroke-width="2" marker-end="url(#ag)"/>
  <text x="250" y="705" text-anchor="middle" font-size="13" fill="#444">everyone writes the WHOLE vector to everyone</text>
  <text x="250" y="890" text-anchor="middle" font-size="13" fill="#444">1 round, but the receiver is not told it arrived</text>

  <text x="740" y="690" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4e8c">The ring (this folder)</text>
  <circle cx="620" cy="760" r="28" fill="#dce9f9" stroke="#1f4e8c" stroke-width="2"/><text x="620" y="767" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e8c">A</text>
  <circle cx="860" cy="760" r="28" fill="#dce9f9" stroke="#1f4e8c" stroke-width="2"/><text x="860" y="767" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e8c">B</text>
  <circle cx="740" cy="850" r="28" fill="#dce9f9" stroke="#1f4e8c" stroke-width="2"/><text x="740" y="857" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e8c">C</text>
  <line x1="650" y1="760" x2="828" y2="760" stroke="#1f4e8c" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="848" y1="784" x2="764" y2="828" stroke="#1f4e8c" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="716" y1="828" x2="632" y2="784" stroke="#1f4e8c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="740" y="705" text-anchor="middle" font-size="13" fill="#444">only a small piece, only to the right neighbour</text>
  <text x="740" y="890" text-anchor="middle" font-size="13" fill="#444">4 dependent rounds; plain SEND/RECV tells the receiver</text>

  <!-- Panel 4 -->
  <rect x="30" y="920" width="940" height="70" rx="10" fill="#eef7ee" stroke="#b9d9bb"/>
  <text x="50" y="946" font-size="16" font-weight="700" fill="#256029">4. Why it is there</text>
  <text x="50" y="969" font-size="14" fill="#222">The paper compares against NCCL's ring. Your Baseline_Barrier is only a simple version of your own idea, so beating it proves little.</text>
  <text x="50" y="986" font-size="14" fill="#222">The ring is the standard reference: your professor wanted it as the baseline. Nothing in your other folders is changed by it.</text>
</svg>
